spring.application.name=gamejpql

#Conexão com banco h2
spring.datasource.url = jdbc:h2:file:./data/bankdb
spring.datasource.driverClassName = org.h2.Driver
spring.jpa.database-platform = org.hibernate.dialect.H2Dialect

#Usuário e senha do banco de dados
spring.datasource.username = teste
spring.datasource.password = 1234

#Propriedades do console h2
#Acessar o endpoint http://localhost:8080/h2
spring.h2.console.enabled = true
spring.h2.console.path = /h2

#Pedindo o acesso a manipulação da camada DDL - Spring Data JPA
spring.jpa.hibernate.ddl-auto = update
